<!DOCTYPE html>
<html>
<head>
    <title>Monitoreo de Flota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style> 
        body { display: flex; height: 100vh; margin: 0; }
        #panel { width: 300px; padding: 15px; border-right: 2px solid #ccc; overflow-y: auto; background: #f9f9f9; }
        #map { flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-msg { background: #28a745; color: white; padding: 12px 20px; margin-top: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1;} }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #panel { width: 100%; height: 35%; border-right: none; border-bottom: 2px solid #ccc; }
        }
        th, td { font-size: 20px; padding: 15px; }
        h2 { font-size: 24px; }
        button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            background-color: #e0e0e0; /* Un color de fondo suave */
            border: 1px solid #999;    /* Un borde para que parezca botón real */
        }
        button:hover {
            background-color: #d1d1d1; /* Se pone un poco más oscuro al pasar el mouse */
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="panel">
        <h2>En Espera (Jornada iniciada)</h2>
        <table id="tabla-espera">
            <thead><tr><th>Unidad</th><th>Estado</th></tr></thead>
            <tbody></tbody>
        </table>
        <h2>Flota Activa</h2>
        <table id="tabla-activa">
            <thead><tr><th>Unidad</th><th>Estado</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([7.76, -72.22], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
        }).addTo(map);

        const taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png',
            iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16]
        });
        // Definición de iconos para los estados de señal
        const iconVerde = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png',
            iconSize: [32, 32], iconAnchor: [16, 16]
        });

        const iconNaranja = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209939.png',
            iconSize: [32, 32], iconAnchor: [16, 16]
        });
        let marcadores = {};
        const listaEspera = document.querySelector('#tabla-espera tbody');
        const listaActiva = document.querySelector('#tabla-activa tbody');

        function actualizarMapa() {
            fetch('/conductores/ubicaciones_activas?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                listaEspera.innerHTML = '';
                listaActiva.innerHTML = '';

                const codigosServidor = data.map(c => c.codigo);
                Object.keys(marcadores).forEach(codigo => {
                    if (!codigosServidor.includes(codigo)) {
                        map.removeLayer(marcadores[codigo]);
                        delete marcadores[codigo];
                    }
                });

                data.forEach(c => {
                    console.log(`Unidad ${c.codigo}: Lat=${c.latitud}, Modo=${c.modo}, Estado=${c.estado}`);
                    
                    if (c.estado === 'disponible') {
                        if (marcadores[c.codigo]) {
                            map.removeLayer(marcadores[c.codigo]);
                            delete marcadores[c.codigo];
                        }
                        return;
                    }

                    // --- NUEVA LÓGICA SEPARADA ---

                    // A) Si está en ESPERA
                    if (c.estado === 'esperando') {
                        listaEspera.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td>${c.codigo}</td>
                                <td>
                                    <button onclick="confirmarTurno('${c.id_conductor}')" style="cursor:pointer;">Habilitar</button>
                                </td>
                            </tr>`);
                    } 
                    // B) Si está ACTIVO
                    else if (c.estado === 'activo') {
                        const tieneUbicacion = c.latitud !== null && c.longitud !== null;
                        
                        if (tieneUbicacion) {
                            listaActiva.insertAdjacentHTML('beforeend', `<tr><td>${c.codigo}</td><td>Activo (GPS)</td></tr>`);
                            
                            const coords = [parseFloat(c.latitud), parseFloat(c.longitud)];
                            const precision = parseFloat(c.horizontal_accuracy) || 0;
                            const iconoSeleccionado = (precision > 50) ? iconNaranja : iconVerde;

                            if (!marcadores[c.codigo]) {
                                // Se crea por primera vez con el icono dinámico y el tooltip
                                marcadores[c.codigo] = L.marker(coords, { icon: iconoSeleccionado })
                                    .addTo(map)
                                    .bindTooltip(c.codigo, { permanent: true, direction: 'top' });
                                console.log(`📍 Creado marcador para ${c.codigo} en [${coords}]`);
                            } else {
                                // Actualizamos posición de forma forzada
                                marcadores[c.codigo].setLatLng(coords);
                                marcadores[c.codigo].setIcon(iconoSeleccionado);
                                
                                // Forzamos a que el mapa redibuje la capa si es necesario
                                if (map.hasLayer(marcadores[c.codigo])) {
                                    marcadores[c.codigo].update();
                                }
                                console.log(`🔄 Movido marcador de ${c.codigo} a [${coords}]`);
                            }
                        } else {
                            // ¡CRÍTICO! Sin Ubicación
                            listaActiva.insertAdjacentHTML('beforeend', `
                                <tr style="background-color: #fff3cd;">
                                    <td>${c.codigo}</td>
                                    <td>⚠️ Sin Ubicación 
                                        <button onclick="darDeBaja('${c.id_conductor}')" style="cursor:pointer; color:red; font-size:10px;">X</button>
                                    </td>
                                </tr>`);
                            
                            // Opcional: remover si no queremos que el marcador anterior se quede ahí
                            if (marcadores[c.codigo]) {
                                map.removeLayer(marcadores[c.codigo]);
                                delete marcadores[c.codigo];
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error al actualizar:', error));
        }

        async function confirmarTurno(id) {
            try {
                const res = await fetch(`/conductores/habilitar/${id}`, { method: 'POST' });
                if (res.ok) {
                    mostrarToast("✅ Conductor habilitado.");
                    await actualizarMapa();
                }
            } catch (e) { console.error("Error:", e); }
        }

        function mostrarToast(mensaje) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        function darDeBaja(idConductor) {
            if (confirm("¿Estás seguro de finalizar la jornada?")) {
                // Debes crear o usar una ruta que reciba el id_conductor y ejecute 
                // la misma lógica que tu función finalizar_turno.
                fetch(`/turnos/finalizar_desde_mapa/${idConductor}`, { 
                    method: 'POST' 
                })
                .then(res => {
                    if (res.ok) {
                        actualizarMapa(); // Esto refrescará y, como pusiste latitud=None, desaparecerá
                    }
                });
            }
        }

        setInterval(actualizarMapa, 5000);
        actualizarMapa();
    </script>
    <script>
        // Presiona la tecla 'G' para ocultar/mostrar el panel y dejar el mapa a pantalla completa
        document.addEventListener('keydown', function(event) {
            if (event.key === 'g' || event.key === 'G') {
                const panel = document.getElementById('panel');
                panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
                map.invalidateSize(); // Esto le dice al mapa que se recalcule al nuevo tamaño
            }
        });
    </script>
</body>
</html>
