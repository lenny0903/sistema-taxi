<!DOCTYPE html>
<html>
<head>
    <title>Monitoreo de Flota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style> 
        /* Estilos base para escritorio */
        body { display: flex; height: 100vh; margin: 0; }
        #panel { width: 300px; padding: 15px; border-right: 2px solid #ccc; overflow-y: auto; background: #f9f9f9; }
        #map { flex-grow: 1; }
        
        /* Reglas de tabla y toast que son comunes */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-msg { background: #28a745; color: white; padding: 12px 20px; margin-top: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1;} }

        /* Estilos específicos para móviles */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #panel { width: 100%; height: 35%; border-right: none; border-bottom: 2px solid #ccc; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="panel">
        <h2>En Espera (Jornada iniciada)</h2>
        <table id="tabla-espera">
            <thead><tr><th>Unidad</th><th>Estado</th></tr></thead>
            <tbody></tbody>
        </table>
        
        <h2>Flota Activa</h2>
        <table id="tabla-activa">
            <thead>
                <tr><th>Unidad</th><th>Estado</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
                // --- CONFIGURACIÓN GLOBAL ---
        const map = L.map('map').setView([7.76, -72.22], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        let marcadores = {};

        // --- REFERENCIAS A ELEMENTOS HTML (Esto soluciona el error) ---
        const listaEspera = document.querySelector('#tabla-espera tbody');
        const listaActiva = document.querySelector('#tabla-activa tbody');

        // --- FUNCIÓN DE ACTUALIZACIÓN ---
        function actualizarMapa() {
            fetch('/conductores/ubicaciones_activas')
            .then(response => response.json())
            .then(data => {
                // 1. Limpieza de tablas
                listaEspera.innerHTML = '';
                listaActiva.innerHTML = '';

                // 2. Limpieza de marcadores que ya no están en la respuesta del servidor
                const codigosServidor = data.map(c => c.codigo);
                Object.keys(marcadores).forEach(codigo => {
                    if (!codigosServidor.includes(codigo)) {
                        map.removeLayer(marcadores[codigo]);
                        delete marcadores[codigo];
                    }
                });

                // 3. Procesar y dibujar
              //const conductoresParaMostrar = data.filter(c => c.estado === 'activo' || c.estado === 'esperando');  
              data.forEach(c => {
                    console.log("Objeto conductor completo:", c);
                    // NUEVO: Si está disponible, ignoramos todo (y borramos si existía)
                    if (c.estado === 'disponible') {
                        if (marcadores[c.codigo]) {
                            map.removeLayer(marcadores[c.codigo]);
                            delete marcadores[c.codigo];
                            console.log(`Conductor ${c.codigo} ahora disponible, marcador borrado.`);
                        }
                        return; // Salimos de esta iteración para este conductor
                    }
                    // NUEVO: Bloque para conductores en espera
                    if (c.estado === 'esperando') {
                        listaEspera.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td>${c.codigo}</td>
                                <td>
                                    <button onclick="confirmarTurno(${c.id_conductor})">Habilitar</button>
                                </td>
                            </tr>`);
                    }
                    else if (c.estado === 'activo') {
                        // Verificamos si los datos de ubicación están presentes
                        const tieneUbicacion = c.latitud !== null && c.longitud !== null;

                        if (c.modo === "gps" && tieneUbicacion) {
                            // --- CASO 1: ACTIVO CON UBICACIÓN (Normal) ---
                            listaActiva.insertAdjacentHTML('beforeend', `<tr><td>${c.codigo}</td><td>Activo (GPS)</td></tr>`);
                            
                            const coords = [parseFloat(c.latitud), parseFloat(c.longitud)];
                            if (!marcadores[c.codigo]) {
                                marcadores[c.codigo] = L.marker(coords, { icon: taxiIcon }).addTo(map)
                                    .bindTooltip(c.codigo, { permanent: true, direction: 'top' })
                                    .bindPopup(`Unidad: ${c.codigo}`);
                            } else {
                                marcadores[c.codigo].setLatLng(coords);
                            }
                        } 
                        else {
                            // --- CASO 2: ACTIVO SIN GPS O SIN UBICACIÓN (Alerta) ---
                            // Aquí agregamos la clase CSS 'alerta-sin-gps' para resaltarlo
                            listaActiva.insertAdjacentHTML('beforeend', `
                                <tr style="background-color: #fff3cd; border-left: 5px solid #ffc107;">
                                    <td>${c.codigo}</td>
                                    <td>⚠️ Sin Ubicación</td>
                                </tr>`);

                            // Si el marcador existía, lo quitamos porque no tenemos ubicación válida
                            if (marcadores[c.codigo]) {
                                map.removeLayer(marcadores[c.codigo]);
                                delete marcadores[c.codigo];
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error al actualizar:', error));
        }
        async function confirmarTurno(id) {
            try {
                const res = await fetch(`/conductores/habilitar/${id}`, { method: 'POST' });
                if (res.ok) {
                    // 1. Damos feedback visual
                    mostrarToast("✅ Atención: Debe iniciar turno en la sección Gestión de Turnos Activos");
                    console.log("Conductor habilitado correctamente");
                    
                    // 2. FORZAMOS el refresco inmediato para que no tengas que esperar los 5s del setInterval
                    await actualizarMapa(); 
                } else {
                    console.error("Error al habilitar");
                }
            } catch (e) {
                console.error("Error de red:", e);
            }
        }
        function mostrarToast(mensaje) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = mensaje;
            container.appendChild(toast);
            
            // Se elimina solo después de 3 segundos
            setTimeout(() => toast.remove(), 4000);
        }

        setInterval(actualizarMapa, 5000);
        actualizarMapa();
    </script>
    
</body>
</html>
