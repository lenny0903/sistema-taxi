<!DOCTYPE html>
<html>
<head>
    <title>Monitoreo de Flota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style> 
        /* Estilos base para escritorio */
        body { display: flex; height: 100vh; margin: 0; }
        #panel { width: 300px; padding: 15px; border-right: 2px solid #ccc; overflow-y: auto; background: #f9f9f9; }
        #map { flex-grow: 1; }
        
        /* Reglas de tabla y toast que son comunes */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-msg { background: #28a745; color: white; padding: 12px 20px; margin-top: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1;} }

        /* Estilos específicos para móviles */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #panel { width: 100%; height: 35%; border-right: none; border-bottom: 2px solid #ccc; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="panel">
        <h2>En Espera (Jornada iniciada)</h2>
        <table id="tabla-espera">
            <thead><tr><th>Unidad</th><th>Estado</th></tr></thead>
            <tbody></tbody>
        </table>
        
        <h2>Flota Activa</h2>
        <table id="tabla-activa">
            <thead>
                <tr><th>Unidad</th><th>Estado</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicialización del mapa
        const map = L.map('map').setView([7.76, -72.22], 14);

        // 2. CAMBIO DE ESTILO: Reemplazamos la capa estándar de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);
                // 3. Tu configuración de icono (se mantiene igual)
        const taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        let marcadores = {};
        

        async function actualizarMapa() {
            try {
                const res = await fetch('/conductores/ubicaciones_activas?t=' + new Date().getTime());
                const data = await res.json();
                
                const listaEspera = document.querySelector('#tabla-espera tbody');
                const listaActiva = document.querySelector('#tabla-activa tbody');
                if (listaEspera) listaEspera.innerHTML = '';
                if (listaActiva) listaActiva.innerHTML = '';

                data.forEach(c => {
                    console.log(`Unidad: ${c.codigo} | Última vez: ${c.ultima_actualizacion}`);
                    
                    // Lógica de Tablas
                    if (c.estado === 'esperando') {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `<td>${c.codigo}</td><td><button onclick="confirmarTurno(${c.id_conductor})">Iniciar Turno</button></td>`;
                        listaEspera.appendChild(fila);
                    } else if (c.estado === 'activo') {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `<td>${c.codigo}</td><td>${c.estado}</td>`;
                        listaActiva.appendChild(fila);
                    }

                    // Lógica de Mapa
                    if (c.latitud !== null && c.longitud !== null) {
                        const ultimaAct = new Date(c.ultima_actualizacion).getTime();
                        const hace15Min = Date.now() - (15 * 60 * 1000);

                        // FILTRO ÚNICO: Si es viejo o inválido, eliminar y salir
                        if (isNaN(ultimaAct) || (c.estado === 'activo' && ultimaAct < hace15Min)) {
                            if (marcadores[c.codigo]) {
                                map.removeLayer(marcadores[c.codigo]);
                                delete marcadores[c.codigo];
                            }
                            return; 
                        }

                        // DIBUJAR O MOVER
                        const coords = [parseFloat(c.latitud), parseFloat(c.longitud)];
                        if (!marcadores[c.codigo]) {
                            const iconUrl = 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png';
                            const icono = L.icon({ iconUrl: iconUrl, iconSize: [32, 32], iconAnchor: [16, 16] });
                            marcadores[c.codigo] = L.marker(coords, { icon: icono }).addTo(map);
                            marcadores[c.codigo].bindPopup(`Unidad: ${c.codigo}`);
                        } else {
                            marcadores[c.codigo].setLatLng(coords);
                        }
                    } else if (marcadores[c.codigo]) {
                        map.removeLayer(marcadores[c.codigo]);
                        delete marcadores[c.codigo];
                    }
                });
            } catch (error) {
                console.error("Error al actualizar:", error);
            }
        }
        async function confirmarTurno(id) {
            try {
                const res = await fetch(`/conductores/habilitar/${id}`, { method: 'POST' });
                if (res.ok) {
                    // 1. Damos feedback visual
                    mostrarToast("✅ Atención: Debe iniciar turno en la sección Gestión de Turnos Activos");
                    console.log("Conductor habilitado correctamente");
                    
                    // 2. FORZAMOS el refresco inmediato para que no tengas que esperar los 5s del setInterval
                    await actualizarMapa(); 
                } else {
                    console.error("Error al habilitar");
                }
            } catch (e) {
                console.error("Error de red:", e);
            }
        }
        function mostrarToast(mensaje) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = mensaje;
            container.appendChild(toast);
            
            // Se elimina solo después de 3 segundos
            setTimeout(() => toast.remove(), 4000);
        }

        setInterval(actualizarMapa, 5000);
        actualizarMapa();
    </script>
    
</body>
</html>
