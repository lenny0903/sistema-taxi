<!DOCTYPE html>
<html>
<head>
    <title>Monitoreo de Flota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style> 
        body { display: flex; height: 100vh; margin: 0; overflow: hidden; position: relative; }
        
        #panel { 
            width: 300px; 
            padding: 15px; 
            border-right: 2px solid #ccc; 
            overflow-y: auto; 
            background: #f9f9f9; 
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        #panel.oculto {
            transform: translateX(-100%);
            position: absolute;
        }

        #map { flex-grow: 1; height: 100vh; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-msg { background: #28a745; color: white; padding: 12px 20px; margin-top: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1;} }

        th, td { font-size: 20px; padding: 15px; }
        h2 { font-size: 24px; }
        
        button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }
        button:hover { background-color: #d1d1d1; }

        /* Botón deslizante flotante */
        #btnToggle {
            position: fixed;
            top: 15px;
            left: 315px;
            z-index: 9999; /* Asegura que siempre esté por encima de todo */
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: left 0.3s ease;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        #btnToggle:hover { background-color: #555; }
    </style>
</head>
<body>

    <!-- PANEL LATERAL -->
    <div id="panel">
        <!-- <h2>En Espera (Jornada iniciada)</h2>
        <table id="tabla-espera">
            <thead><tr><th>Unidad</th><th>Estado</th></tr></thead>
            <tbody></tbody>
        </table> -->
        
        <h2>Flota Activa</h2>
        <table id="tabla-activa">
            <thead>
                <tr>
                    <th>Unidad</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- BOTÓN DESLIZANTE -->
    <button onclick="togglePanel()" id="btnToggle">◀</button>

    <!-- MAPA Y TOASTS -->
    <div id="toast-container"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
       // 1. Definir capas base
        const capaEstandar = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        });

        const capaSatelital = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        // Capa transparente con los nombres de las calles y avenidas
        const capaEtiquetas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        // Unimos el satélite con los nombres de las calles
        const capaHibrida = L.layerGroup([capaSatelital, capaEtiquetas]);

        // 2. Crear mapa con capa estándar por defecto
        const map = L.map('map', {
            center: [7.76, -72.22],
            zoom: 14,
            layers: [capaEstandar]
        });

        // 3. Agregar control de capas en la esquina superior derecha
        const baseMaps = {
            "Estándar": capaEstandar,
            "Satélite": capaSatelital,
            "Híbrido (Satélite + Calles)": capaHibrida
        };
        L.control.layers(baseMaps).addTo(map);

        // 4. Tus íconos
        const iconVerde = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209926.png',
            iconSize: [32, 32], iconAnchor: [16, 16]
        });

        const iconNaranja = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3209/3209939.png',
            iconSize: [32, 32], iconAnchor: [16, 16]
        });

        let marcadores = {};
        const listaActiva = document.querySelector('#tabla-activa tbody');

        function actualizarMapa() {
            fetch('/conductores/ubicaciones_activas?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                listaActiva.innerHTML = '';

                const codigosServidor = data.map(c => c.codigo);
                Object.keys(marcadores).forEach(codigo => {
                    if (!codigosServidor.includes(codigo)) {
                        map.removeLayer(marcadores[codigo]);
                        delete marcadores[codigo];
                    }
                });

                data.forEach(c => {
                    if (c.estado === 'disponible') {
                        if (marcadores[c.codigo]) {
                            map.removeLayer(marcadores[c.codigo]);
                            delete marcadores[c.codigo]; // ✅ Corregido aquí
                        }
                        return;
                    }

                    if (c.estado === 'activo' || c.estado === 'en curso') {
                        const tieneUbicacion = c.latitud !== null && c.longitud !== null;
                        
                        if (tieneUbicacion) {
                            const infoTiempo = `${c.opcion_gps} (${c.tiempo_restante})`;
    
                            listaActiva.insertAdjacentHTML('beforeend', `
                                <tr>
                                    <td>${c.codigo}</td>
                                    <td>
                                        <span style="color: green; font-weight: bold;">Activo (GPS)</span><br>
                                        <small style="font-size: 12px; color: #555;">⏱️ ${infoTiempo}</small>
                                    </td>
                                </tr>`);
                            
                            const coords = [parseFloat(c.latitud), parseFloat(c.longitud)];
                            const precision = parseFloat(c.horizontal_accuracy) || 0;
                            const iconoSeleccionado = (precision > 50) ? iconNaranja : iconVerde;

                            if (!marcadores[c.codigo]) {
                                marcadores[c.codigo] = L.marker(coords, { icon: iconoSeleccionado })
                                    .addTo(map)
                                    .bindTooltip(c.codigo, { permanent: true, direction: 'top' });
                            } else {
                                marcadores[c.codigo].setLatLng(coords);
                                marcadores[c.codigo].setIcon(iconoSeleccionado);
                                if (map.hasLayer(marcadores[c.codigo])) {
                                    marcadores[c.codigo].update();
                                }
                            }
                        } else {
                            listaActiva.insertAdjacentHTML('beforeend', `
                                <tr style="background-color: #fff3cd;">
                                    <td>${c.codigo}</td>
                                    <td>⚠️ Sin Ubicación 
                                        <button onclick="darDeBaja('${c.id_conductor}')" style="cursor:pointer; color:red; font-size:10px;">X</button>
                                    </td>
                                </tr>`);
                            
                            if (marcadores[c.codigo]) {
                                map.removeLayer(marcadores[c.codigo]);
                                delete marcadores[c.codigo]; // ✅ Corregido aquí también
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error al actualizar:', error));
        }
        function mostrarToast(mensaje) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function darDeBaja(idConductor) {
            if (confirm("¿Estás seguro de finalizar la jornada?")) {
                fetch(`/turnos/finalizar_desde_mapa/${idConductor}`, { method: 'POST' })
                .then(res => { if (res.ok) { actualizarMapa(); } });
            }
        }

        // Función para ocultar/mostrar el panel con el botón deslizante
        function togglePanel() {
            const panel = document.getElementById('panel');
            const btn = document.getElementById('btnToggle');
            
            panel.classList.toggle('oculto');

            if (panel.classList.contains('oculto')) {
                btn.style.left = '0px';
                btn.innerHTML = '▶';
            } else {
                btn.style.left = '315px';
                btn.innerHTML = '◀';
            }
            
            // Forzar a Leaflet a recalcular el tamaño para que el mapa ocupe todo
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // Atajo de teclado 'G' o 'g' también operativo
        document.addEventListener('keydown', function(event) {
            if (event.key === 'g' || event.key === 'G') {
                togglePanel();
            }
        });

        setInterval(actualizarMapa, 5000);
        actualizarMapa();
    </script>
</body>
</html>
