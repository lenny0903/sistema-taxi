<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Exitosa — Taxis Los Patriotas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; padding: 50px; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .icon { font-size: 50px; color: #28a745; margin-bottom: 15px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .badge { background: #e9ecef; padding: 8px 12px; border-radius: 6px; font-weight: bold; display: inline-block; margin-top: 15px; color: #495057; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>¡Solicitud Registrada!</h2>
        <p>Tu reserva ha sido procesada con éxito por la web y enviada a la central de la línea.</p>
        <div class="badge">Nro. de Solicitud: #{{ id_reserva }}</div>
        <p style="margin-top: 20px; font-size: 13px; color: #888;">Un operador te asignará una unidad a la hora programada.</p>
    </div>
</body>
</html>
