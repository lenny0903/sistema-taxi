<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Recibida - Taxis Los Patriotas</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 32px; border-radius: 12px; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: {{ '#16a34a' if exito else '#dc2626' }}; margin: 0 0 12px; }
        p { color: #666; font-size: 16px; line-height: 1.5; }
        .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">{{ '✅' if exito else '⚠️' }}</div>
        <h1>{{ '¡Solicitud Recibida!' if exito else 'Atención' }}</h1>
        <p>{{ mensaje }}</p>
        <div class="footer">Línea de Taxis Los Patriotas</div>
    </div>
</body>
</html>
