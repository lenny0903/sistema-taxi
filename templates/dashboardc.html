<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Gestión de Taxis</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Barra superior -->
    <header class="bg-indigo-700 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Sistema de Gestión de Taxis</h1>
        <div>
            <span id="userRole" class="mr-4"></span>
            <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded">Salir</button>
        </div>
    </header>

    <!-- Menú lateral -->
    <div class="flex">
        <nav class="w-64 bg-white shadow-md h-screen p-4">
            <ul class="space-y-2">
                <li><button onclick="mostrarSeccion('clientes')" class="w-full text-left">Clientes</button></li>
                <li class="menu-admin"><button onclick="mostrarSeccion('conductores')" class="w-full text-left">Conductores</button></li>
                <li class="menu-admin"><button onclick="mostrarSeccion('autos')" class="w-full text-left">Autos</button></li>
                <li><button onclick="mostrarSeccion('despachos')" class="w-full text-left">Despachos</button></li>
                <li class="menu-admin"><button onclick="mostrarSeccion('reportes')" class="w-full text-left">Reportes</button></li>
            </ul>
        </nav>

        <!-- Contenido principal -->
        <main class="flex-1 p-6 space-y-8">

            <!-- Clientes -->
            <section id="clientes" class="seccion hidden">
                <h2 class="text-2xl font-bold mb-4">Gestión de Clientes</h2>
                <form id="formCliente" class="space-y-2">
                    <input type="text" id="cliNombre" placeholder="Nombre" class="border p-2 w-full">
                    <input type="text" id="cliTelefono" placeholder="Teléfono" class="border p-2 w-full">
                    <input type="text" id="cliDireccion" placeholder="Dirección" class="border p-2 w-full">
                    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Guardar</button>
                </form>
                <table id="tablaClientes" class="mt-4">
                    <thead><tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Conductores -->
            <section id="conductores" class="seccion hidden">
                <h2 class="text-2xl font-bold mb-4">Gestión de Conductores</h2>
                <form id="formConductor" class="space-y-2">
                    <input type="text" id="conNombre" placeholder="Nombre" class="border p-2 w-full">
                    <input type="text" id="conCodigo" placeholder="Código" class="border p-2 w-full">
                    <input type="text" id="conTelefono" placeholder="Teléfono" class="border p-2 w-full">
                    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Guardar</button>
                </form>
                <table id="tablaConductores" class="mt-4">
                    <thead><tr><th>Nombre</th><th>Código</th><th>Teléfono</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Autos -->
            <section id="autos" class="seccion hidden">
                <h2 class="text-2xl font-bold mb-4">Gestión de Autos</h2>
                <form id="formAuto" class="space-y-2">
                    <input type="text" id="autoPlaca" placeholder="Placa" class="border p-2 w-full">
                    <input type="text" id="autoTipo" placeholder="Tipo" class="border p-2 w-full">
                    <input type="text" id="autoMarca" placeholder="Marca" class="border p-2 w-full">
                    <input type="text" id="autoModelo" placeholder="Modelo" class="border p-2 w-full">
                    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Guardar</button>
                </form>
                <table id="tablaAutos" class="mt-4">
                    <thead><tr><th>Placa</th><th>Tipo</th><th>Marca</th><th>Modelo</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Despachos -->
            <section id="despachos" class="seccion hidden">
              <h2 class="text-2xl font-bold mb-4">Gestión de Despachos</h2>

              <form id="formDespacho" class="space-y-2">
                <input type="text" id="desTelefono" placeholder="Teléfono del cliente" class="border p-2 w-full">
                <input type="text" id="desOrigen" placeholder="Origen" class="border p-2 w-full" disabled>
                <input type="text" id="desDestino" placeholder="Destino" class="border p-2 w-full" disabled>
                <input type="number" id="desTarifa" placeholder="Tarifa" class="border p-2 w-full" disabled>
                <select id="desCliente" class="border p-2 w-full"></select>
                <select id="desConductor" class="border p-2 w-full"></select>
                <select id="desAuto" class="border p-2 w-full"></select>
                <button id="btnCrearDespacho" type="submit" class="bg-green-500 text-white px-4 py-2 rounded" disabled>
                  Crear
                </button>
              </form>
              <table id="tablaDespachos" class="mt-4">
                <thead>
                  <tr><th>Origen</th><th>Destino</th><th>Tarifa</th><th>Estado</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </section>

            <!-- Reportes -->
            <section id="reportes" class="seccion hidden">
                <h2 class="text-2xl font-bold mb-4">Reportes</h2>
                <button onclick="cargarReporte()" class="bg-blue-500 text-white px-4 py-2 rounded">Generar Reporte</button>
                <div id="reporteResultado" class="mt-4"></div>
            </section>

        </main>
    </div>
<script>
    
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');

    if (!token) {
        window.location.href = '/index.html';
        return;
    }

    document.getElementById('userRole').textContent = `Rol: ${rol}`;
    if (rol.toLowerCase() === 'operador') {
        document.querySelectorAll('.menu-admin').forEach(el => el.style.display = 'none');
    }

    // Función global para fetch con token
  window.apiFetch = (url, options = {}) => {
    const token = localStorage.getItem('token');
    const baseHeaders = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    };
    const merged = {
      ...options,
      headers: { ...baseHeaders, ...(options.headers || {}) }
    };
    return fetch(url, merged);
  };

    // Cargar datos iniciales
    cargarClientes();
    cargarConductores();
    cargarAutos();
    cargarDespachos();
    cargarTurnos();

});

// Cerrar sesión
document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location.href = '/index.html';
});

// Mostrar secciones
function mostrarSeccion(id) {
    document.querySelectorAll('.seccion').forEach(sec => sec.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

/* =========================

async function cargarClientes() {
    const res = await apiFetch('/clientes');
    const data = await res.json();
    const tbody = document.querySelector('#tablaClientes tbody');
    tbody.innerHTML = data.map(c => `<tr><td>${c.nombre}</td><td>${c.nro_telefono}</td><td>${c.direccion}</td></tr>`).join('');
    const sel = document.getElementById('desCliente');
    sel.innerHTML = data.map(c => `<option value="${c.id_clientes}">${c.nombre}</option>`).join('');
}

document.getElementById('formCliente').addEventListener('submit', async e => {
    e.preventDefault();
    const cliente = {
        nombre: document.getElementById('cliNombre').value,
        nro_telefono: document.getElementById('cliTelefono').value,
        direccion: document.getElementById('cliDireccion').value
    };
    await apiFetch('/clientes', { method: 'POST', body: JSON.stringify(cliente) });
    e.target.reset();
    cargarClientes();
});

   CONDUCTORES
========================= */
async function cargarConductores() {
  const res = await apiFetch("/conductores/activos");
  const data = await res.json();
  const selConductor = document.getElementById("desConductor");
  selConductor.innerHTML = Array.isArray(data) && data.length > 0
    ? data.map(c => `<option value="${c.id_conductor}">${c.nombre}</option>`).join("")
    : "<option disabled>No hay conductores activos</option>";
}

document.getElementById('formConductor').addEventListener('submit', async e => {
    e.preventDefault();
    const conductor = {
        nombre: document.getElementById('conNombre').value,
        cod_conductor: document.getElementById('conCodigo').value,
        nro_telefono: document.getElementById('conTelefono').value
    };
    await apiFetch('/conductores', { method: 'POST', body: JSON.stringify(conductor) });
    e.target.reset();
    cargarConductores();
});

async function cargarDespachos() {
    const res = await apiFetch('/despachos');
    const data = await res.json();
    const tbody = document.querySelector('#tablaDespachos tbody');
    tbody.innerHTML = data.map(d => `<tr><td>${d.origen}</td><td>${d.destino}</td><td>${d.tarifa}</td><td>${d.estado_despacho}</td></tr>`).join('');
}

document.getElementById('formDespacho').addEventListener('submit', async e => {
  e.preventDefault();

  const clienteId = document.getElementById('desCliente').value;
  if (!clienteId) {
    alert('❌ No puede crear un despacho sin validar el cliente.');
    return;
  }

  const despacho = {
    origen: document.getElementById('desOrigen').value,
    destino: document.getElementById('desDestino').value,
    tarifa: parseFloat(document.getElementById('desTarifa').value),
    cliente_id: parseInt(clienteId),
    conductor_id: parseInt(document.getElementById('desConductor').value),
    auto_id: parseInt(document.getElementById('desAuto').value)
  };

  const res = await apiFetch('/despachos', { method: 'POST', body: JSON.stringify(despacho) });
  const data = await res.json();

  if (res.ok) {
    e.target.reset();
    activarCamposDespacho(false);
    cargarDespachos();
    alert('✅ Despacho creado');
  } else {
    alert('❌ Error al crear despacho: ' + (data.error || 'verifica turno activo'));
  }
});

async function validarClientePorTelefono() {
  const telefono = document.getElementById('desTelefono').value.trim();
  if (!telefono) return;

  const res = await apiFetch(`/clientes/buscar?telefono=${telefono}`);
  const data = await res.json();

  const selCliente = document.getElementById('desCliente');

  if (Array.isArray(data) && data.length > 0) {
    // Cliente encontrado
    selCliente.innerHTML = `<option value="${data[0].id_cliente}">${data[0].nombre}</option>`;
    document.getElementById('desOrigen').value = data[0].direccion || '';
    activarCamposDespacho(true);
  } else {
    // Cliente no encontrado
    selCliente.innerHTML = '';
    document.getElementById('desOrigen').value = '';
    if (confirm('Cliente no registrado. ¿Desea crear uno nuevo?')) {
      const nombre = prompt('Ingrese el nombre del cliente:');
      const direccion = prompt('Ingrese la dirección del cliente:');
      if (nombre && direccion) {
        const nuevoCliente = { telefono, nombre, direccion };
        const resPost = await apiFetch('/clientes', {
          method: 'POST',
          body: JSON.stringify(nuevoCliente)
        });
        const result = await resPost.json();
        if (resPost.ok) {
          alert('✅ Cliente creado correctamente');
          selCliente.innerHTML = `<option value="${result.id_cliente}">${nombre}</option>`;
          document.getElementById('desOrigen').value = direccion;
          activarCamposDespacho(true);
        } else {
          alert('Error al crear cliente: ' + (result.error || 'desconocido'));
          activarCamposDespacho(false);
        }
      } else {
        activarCamposDespacho(false);
      }
    } else {
      activarCamposDespacho(false);
    }
  }
}
// Verifica si ya hay cliente, conductor y auto seleccionados
function verificarDespachoListo() {
  const cliente = document.getElementById('desCliente').value;
  const conductor = document.getElementById('desConductor').value;
  const auto = document.getElementById('desAuto').value;

  const listo = cliente && conductor && auto;
  document.getElementById('btnCrearDespacho').disabled = !listo;
}

// Función auxiliar para activar/desactivar campos
function activarCamposDespacho(estado) {
  document.getElementById('desOrigen').disabled = !estado;
  document.getElementById('desDestino').disabled = !estado;
  document.getElementById('desTarifa').disabled = !estado;
  document.getElementById('desCliente').disabled = !estado;
  document.getElementById('desConductor').disabled = !estado;
  document.getElementById('desAuto').disabled = !estado;
  document.getElementById('btnCrearDespacho').disabled = !estado;
}

  }
});

//Reporte de conductores
async function cargarReporte() {
  try {
    const res = await apiFetch('/reportes/conductor'); // usa apiFetch para incluir el token
    if (!res.ok) {
      throw new Error("Error al obtener el reporte");
    }
    const data = await res.json();
    const contenedor = document.getElementById("reporteResultado");

    if (!data || data.length === 0) {
      contenedor.innerHTML = "<p class='text-gray-600'>No hay datos disponibles.</p>";
      return;
    }

    // Construir tabla con TailwindCSS
    let tabla = `
      <table class="min-w-full border-collapse border border-gray-300 mt-4">
        <thead class="bg-gray-200">
          <tr>
            <th class="border border-gray-300 px-4 py-2 text-left">Conductor</th>
            <th class="border border-gray-300 px-4 py-2 text-center">Total Servicios</th>
            <th class="border border-gray-300 px-4 py-2 text-center">Total Tarifas</th>
          </tr>
        </thead>
        <tbody>
    `;

    data.forEach(item => {
      tabla += `
        <tr class="hover:bg-gray-100">
          <td class="border border-gray-300 px-4 py-2">${item.conductor}</td>
          <td class="border border-gray-300 px-4 py-2 text-center">${item.total_servicios}</td>
          <td class="border border-gray-300 px-4 py-2 text-center">${item.total_tarifas}</td>
        </tr>
      `;
    });

    tabla += `</tbody></table>`;
    contenedor.innerHTML = tabla;
  } catch (error) {
    document.getElementById("reporteResultado").innerHTML =
      "<p class='text-red-600'>Error cargando el reporte: " + error.message + "</p>";
  }
}
